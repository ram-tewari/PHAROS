name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  MODE: CLOUD
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Lint, module isolation, secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: pip install ruff==0.17.2 detect-secrets==1.5.0
      - name: Ruff (whole tree, bug-class rules)
        run: ruff check app alembic benchmarks scripts tests --select E9,F63,F7,F82 --output-format github
      - name: Ruff (new and rewritten code, full rules + imports/bugbear/pyupgrade)
        run: >
          ruff check --extend-select I,B,UP --output-format github
          app/codeintel app/modules/code app/shared/auth.py app/shared/db_url.py
          app/shared/vector_type.py app/cli.py benchmarks scripts/demo.py tests/codeintel
      - name: Module isolation
        run: python scripts/check_module_isolation.py
      - name: Secret scan (new findings fail; see .secrets.baseline)
        working-directory: .
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  test:
    name: Tests (Python ${{ matrix.python }}, SQLite + PostgreSQL/pgvector)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: pharos
          POSTGRES_PASSWORD: pharos
          POSTGRES_DB: pharos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pharos -d pharos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PHAROS_TEST_DATABASE_URL: postgresql://pharos:pharos@localhost:5432/pharos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install (hash-pinned lock)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Test suite (SQLite and PostgreSQL parametrisations)
        run: python -m pytest tests -q -rfEs --timeout 300 --junitxml=junit.xml
      - name: Migrations (alembic check + upgrade/downgrade from scratch on PostgreSQL)
        run: python -m pytest tests/codeintel/test_migrations.py -q
      - name: End-to-end demo (index a polyglot repo, search, context)
        run: python scripts/demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python }}
          path: backend/junit.xml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reported, not gating, so that a newly published CVE in a transitive
    # dependency does not block unrelated PRs; triage the report instead.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --strict -r requirements-cloud.txt

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API/worker image
        run: docker build -t pharos-api:ci .
      - name: Image starts without ML frameworks and reports its version
        run: >
          docker run --rm --entrypoint python pharos-api:ci -c
          "import app, importlib.util as u; print(app.APP_VERSION); assert u.find_spec('torch') is None"
