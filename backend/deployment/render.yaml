services:
  - type: web
    name: pharos-cloud-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./deployment/Dockerfile.cloud
    dockerContext: ./
    envVars:
      # Core Configuration
      - key: MODE
        value: CLOUD
      - key: ENV
        value: prod
      
      # Secrets and connection strings are managed in the Render dashboard
      # (sync: false): a blueprint sync never writes values from this file.
      # DATABASE_URL must include ?sslmode=require for Neon.
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # API tokens (machine-to-machine). Admin: indexing and deletes;
      # read: search, context and the MCP endpoint (give this one to MCP clients).
      # PHAROS_API_KEY / JWT_SECRET_KEY / ALLOWED_REDIRECT_URLS are no longer read.
      - key: PHAROS_ADMIN_TOKEN
        generateValue: true
      - key: PHAROS_READ_TOKEN
        generateValue: true

      # Hostnames clients use for /mcp (DNS-rebinding protection; localhost is always allowed)
      - key: MCP_ALLOWED_HOSTS
        value: '["pharos-cloud-api.onrender.com"]'

      # Query embeddings come from the edge worker's embedding server
      # (EMBEDDING_BACKEND=auto -> http when EDGE_EMBEDDING_URL is set; without
      # it only keyword search is available and dense modes report "unavailable").
      - key: EMBEDDING_BACKEND
        value: auto
      - key: EDGE_EMBEDDING_URL
        sync: false
      - key: EDGE_EMBED_TOKEN
        sync: false

      # Resource Limits (Free Tier Optimized)
      - key: MAX_QUEUE_SIZE
        value: 10
      - key: TASK_TTL_SECONDS
        value: 3600
      - key: MAX_WORKERS
        value: 2
      
      # RAG Configuration (Minimal for Free Tier)
      - key: CHUNK_ON_RESOURCE_CREATE
        value: false
      - key: GRAPH_EXTRACTION_ENABLED
        value: true
      - key: SYNTHETIC_QUESTIONS_ENABLED
        value: false
      
      # Embedding Model (Lazy load in CLOUD mode to save memory)
      - key: EMBEDDING_MODEL_NAME
        value: nomic-ai/nomic-embed-text-v1
      - key: PRELOAD_EMBEDDING_MODEL
        value: false
    
    healthCheckPath: /health
    autoDeploy: true
